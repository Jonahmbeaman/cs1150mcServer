name: ClassServer
version: '0.1.0'
main: io.github.jonahmbeaman.classserver.ClassServerPlugin
api-version: '26.2'
description: Beginner Java exercises for the class Minecraft server.
commands:
  hello:
    description: Say hello.
    usage: /hello
  dice:
    description: Roll a six-sided die.
    usage: /dice
  count:
    description: Print the numbers 1 through 5.
    usage: /count
