name: Deploy class changes automatically
on:
  push:
    branches: [main]
    paths: ['src/**', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties', 'gradle/**', 'gradlew', 'gradlew.bat', '.github/workflows/deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pebble-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.8.0'
      - run: gradle --no-daemon clean build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: class-plugin
          path: build/libs/class-server.jar
          if-no-files-found: error
          retention-days: 7
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # No required reviewer after Jonah authorizes activation.
    # Restrict this environment to main; fork PRs never enter this job.
    environment: pebble-production
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: class-plugin
          path: out
      - name: Stop, upload one JAR, start and verify
        env:
          API_TOKEN: ${{ secrets.PEBBLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$API_TOKEN" && test -s out/class-server.jar
          base='https://panel.pebblehost.com/api/client/servers/1c8d750f'
          auth="Authorization: Bearer $API_TOKEN"
          power() {
            curl --fail --silent --show-error --max-time 45 -H "$auth" -H 'Accept: application/json' \
              -H 'Content-Type: application/json' --data "{\"signal\":\"$1\"}" "$base/power"
          }
          state=$(curl --fail --silent --show-error -H "$auth" -H 'Accept: application/json' "$base/resources" | jq -er '.attributes.state')
          test "$state" = running || { echo 'Preflight not running; no stop.'; exit 1; }
          trap 'code=$?; if [ $code -ne 0 ]; then power start || true; fi' EXIT
          power stop
          sleep 45
          state=$(curl --fail --silent --show-error -H "$auth" -H 'Accept: application/json' "$base/resources" | jq -r '.attributes.state')
          test "$state" = offline || { echo 'Not stopped. No upload.'; exit 1; }
          curl --fail --silent --show-error -H "$auth" -H 'Accept: application/json' "$base/files/contents?file=%2Fplugins%2Fclass-server.jar" \
            -o out/previous-class-server.jar || rm -f out/previous-class-server.jar
          upload=$(curl --fail --silent --show-error -H "$auth" -H 'Accept: application/json' "$base/files/upload" | jq -r '.attributes.url')
          test -n "$upload" && test "$upload" != null
          echo "::add-mask::$upload"
          curl --fail --silent --show-error --max-time 90 \
            -F 'files=@out/class-server.jar;filename=class-server.jar' "$upload&directory=/plugins"
          power start
          sleep 60
          state=$(curl --fail --silent --show-error -H "$auth" -H 'Accept: application/json' "$base/resources" | jq -r '.attributes.state')
          test "$state" = running || { echo 'Not running. Check console and restore prior JAR.'; exit 1; }
          trap - EXIT
          echo 'Uploaded JAR and server reports running. Verify plugin load/commands in console.'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: previous-class-plugin
          path: out/previous-class-server.jar
          if-no-files-found: ignore
          retention-days: 14
